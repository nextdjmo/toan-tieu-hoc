<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tạo đề Toán Tiểu học</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f3f6ff;
        --cd: #fff;
        --tx: #1f2a44;
        --mu: #6b7794;
        --bd: #e0e6f6;
        --pr: #4f6bff;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #12162a;
          --cd: #1b2140;
          --tx: #e8ecff;
          --mu: #9aa5cc;
          --bd: #2c3560;
        }
      }
      :root[data-theme="dark"] {
        --bg: #12162a;
        --cd: #1b2140;
        --tx: #e8ecff;
        --mu: #9aa5cc;
        --bd: #2c3560;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family: Nunito, system-ui, sans-serif;
      }
      header {
        background: linear-gradient(120deg, #4f6bff, #8b5cf6 60%, #ec4899);
        color: #fff;
        padding: 26px 20px;
        text-align: center;
      }
      header h1 {
        margin: 0;
        font-size: clamp(22px, 4vw, 32px);
        font-weight: 800;
      }
      header p {
        margin: 6px 0 0;
        opacity: 0.9;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px;
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
        gap: 16px;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 4px 14px rgba(60, 80, 160, 0.07);
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .tab {
        flex: 1;
        min-width: 64px;
        border: 2px solid var(--bd);
        background: var(--cd);
        color: var(--tx);
        border-radius: 12px;
        padding: 9px 6px;
        font:
          800 15px Nunito,
          sans-serif;
        cursor: pointer;
      }
      .tab.on {
        background: var(--c);
        border-color: var(--c);
        color: #fff;
      }
      .mod {
        border: 2px solid var(--bd);
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 8px;
        transition: 0.15s;
      }
      .mod.on {
        border-color: var(--c);
        background: color-mix(in srgb, var(--c) 9%, transparent);
      }
      .mod label b {
        margin-left: 6px;
        font-weight: 800;
      }
      .mod small {
        color: var(--mu);
        display: block;
        margin-top: 4px;
      }
      .ctl {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 8px;
        font-size: 13px;
        color: var(--mu);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--bd);
        border-radius: 9px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--tx);
        padding: 5px 12px;
        font:
          700 13px Nunito,
          sans-serif;
        cursor: pointer;
      }
      .seg button.a {
        background: var(--c);
        color: #fff;
      }
      input[type="number"],
      input[type="text"] {
        border: 1px solid var(--bd);
        background: var(--bg);
        color: var(--tx);
        border-radius: 8px;
        padding: 6px 8px;
        font: inherit;
      }
      input[type="number"] {
        width: 56px;
      }
      input[type="text"] {
        width: 100%;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--c, var(--pr));
        vertical-align: middle;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 16px;
        font:
          800 15px Nunito,
          sans-serif;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(120deg, #4f6bff, #8b5cf6);
      }
      .btn.g {
        background: var(--cd);
        color: var(--tx);
        border: 2px solid var(--bd);
      }
      .btn.big {
        width: 100%;
        font-size: 17px;
        padding: 14px;
      }
      .pv {
        overflow-x: auto;
        background: #dfe5f5;
        border-radius: 12px;
        padding: 12px;
      }
      .empty {
        color: var(--mu);
        text-align: center;
        padding: 40px 10px;
      }
      #paper {
        width: 190mm;
        min-height: 200mm;
        margin: 0 auto;
        background: #fff;
        color: #111;
        padding: 6mm 4mm;
        font:
          16px/1.5 "Times New Roman",
          serif;
      }
      #paper h1 {
        text-align: center;
        font-size: 22px;
        margin: 0 0 6px;
      }
      #paper h2 {
        text-align: center;
        margin: 0 0 10px;
      }
      #paper .nm {
        margin: 0 0 12px;
      }
      #paper h3 {
        font-size: 16px;
        margin: 14px 0 6px;
      }
      #paper h3 em {
        font-weight: 400;
        color: #666;
        font-size: 13px;
      }
      .qs {
        columns: 2;
        column-gap: 24px;
      }
      .qs > div {
        break-inside: avoid;
        padding: 5px 0;
      }
      .qs.w {
        columns: 1;
      }
      .qs.w > div {
        padding: 5px 0 26px;
      }
      .ans {
        page-break-before: always;
        padding-top: 6px;
      }
      .ans p {
        margin: 6px 0;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: #1f2a44;
        color: #fff;
        padding: 10px 18px;
        border-radius: 99px;
        opacity: 0;
        transition: 0.2s;
        pointer-events: none;
        z-index: 9;
      }
      #toast.s {
        opacity: 1;
      }
      #paper table {
        width: 100%;
        border-collapse: collapse;
      }
      .hd td {
        vertical-align: top;
        text-align: center;
        font-size: 15px;
        width: 50%;
      }
      .bx {
        margin: 8px 0 10px;
      }
      .bx td {
        border: 1px solid #111;
        padding: 6px 8px;
        vertical-align: top;
        height: 24mm;
        font-size: 15px;
      }
      #paper h3 em {
        color: #111;
        font-weight: 700;
        font-size: 16px;
        font-style: normal;
      }
      .qs.w > div {
        padding: 6px 0 12px;
      }
      .sp1 > div {
        padding-bottom: 14px;
      }
      .sp2 > div {
        padding-bottom: 38px;
      }
      .qi {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .fg {
        flex: none;
      }
      .ln {
        display: flex;
        align-items: flex-end;
        height: 8mm;
        overflow: hidden;
        white-space: nowrap;
      }
      .ln .dt {
        flex: 1;
        overflow: hidden;
        letter-spacing: 3px;
        color: #333;
        margin-left: 4px;
        line-height: 1.1;
      }
      .fr {
        display: inline-flex;
        flex-direction: column;
        vertical-align: middle;
        text-align: center;
        margin: 0 3px;
        line-height: 1.2;
        font-size: 0.95em;
      }
      .fr > i {
        font-style: normal;
        padding: 0 3px;
      }
      .fr > i:first-child {
        border-bottom: 1.5px solid #111;
      }
      .qs.mq {
        columns: 1;
      }
      .qs.mq > div {
        padding: 4px 0 8px;
      }
      .op {
        display: grid;
        gap: 2px 10px;
        margin-top: 3px;
        padding-left: 6px;
      }
      .op.c4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .op.c2 {
        grid-template-columns: repeat(2, 1fr);
      }
      .op.c1 {
        grid-template-columns: 1fr;
      }
      #paper h3.pt {
        text-align: center;
        font-size: 17px;
        margin: 18px 0 4px;
      }
      #paper .hn {
        font-weight: 400;
        font-style: italic;
        color: #555;
        font-size: 14px;
      }
      .hh {
        margin: 14px 0 8px;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(120deg, #f59e0b, #ec4899);
      }
      .end {
        text-align: center;
        margin-top: 14px;
        font-style: italic;
      }
      label.f {
        display: block;
        margin-top: 8px;
      }


      .curriculum-note{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:#eef7ff;border:1px solid #cfe7ff;color:#334155;font-size:12px;line-height:1.45}
      .structure-box{margin-top:12px;padding:12px 14px;border:1px solid #dbe3f0;border-radius:14px;background:linear-gradient(180deg,#fbfdff,#f5f8fc)}
      .structure-box .f{margin:0}
      .structure-box textarea{margin-top:7px;min-height:104px;resize:vertical;line-height:1.55;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:10px 12px;box-sizing:border-box;width:100%;font:inherit}
      .hint{font-size:12px;color:var(--mu);font-weight:500}
      .structure-help{margin-top:8px;font-size:12px;color:var(--mu);line-height:1.5}
      .structure-help span{display:inline-block;padding:2px 7px;margin:2px 2px;border-radius:999px;background:#eef2ff;color:#475569}
    </style>
  </head>
  <body>
    <header>
      <h1>🧮 Tạo đề Toán Tiểu học</h1>
      <p>Chọn lớp → chọn dạng bài đúng khối kiến thức → chọn mức độ → tạo đề → tải Word / PDF</p>
    </header>
    <main>
      <section>
        <div class="card">
          <div class="tabs" id="tabs"></div>
          <div id="mods"></div>
          <div class="row">
            <button class="btn g" onclick="all(1)">Chọn tất cả lớp này</button
            ><button class="btn g" onclick="all(0)">Bỏ chọn</button
            >
          </div>
          <div class="row">
            <button class="btn g" onclick="setMode(0)">✍️ Cả lớp: tự luận</button
            ><button class="btn g" onclick="setMode(1)">🔘 Cả lớp: trắc nghiệm</button>
          </div>
        </div>
        <div class="card" style="margin-top: 12px">
          <label class="f"
            >Tên trường<input
              type="text"
              id="sc"
              value="TRƯỜNG TIỂU HỌC ....................."
          /></label>
          <label class="f"
            >Tiêu đề đề bài<input
              type="text"
              id="ti"
              value="ĐỀ KIỂM TRA MÔN TOÁN"
          /></label>
          <label class="f"
            >Thời gian làm bài<input type="text" id="tm" value="40 phút"
          /></label>
          <div class="structure-box">
            <label class="f"><b>Cấu trúc đề riêng</b> <span class="hint">(không bắt buộc)</span>
              <textarea id="structure" rows="4" placeholder="Ví dụ:
Phần I - 5 câu tính toán
Phần II - 3 câu tìm x
Phần III - 2 bài toán có lời văn"></textarea>
            </label>
            <div class="structure-help">Gợi ý: <span>tính toán</span> · <span>tìm x</span> · <span>tư duy</span> · <span>quy luật</span> · <span>lời văn</span> · <span>hình học</span> · <span>phân số</span> · <span>thập phân</span> · <span>thống kê</span></div>
          </div>
          <div class="row">
            <label
              ><input type="checkbox" id="sp" checked /> Chừa chỗ trình bày lời
              giải</label
            >
          </div>
          <div class="row" style="align-items: center">
            <label
              ><input type="checkbox" id="key" checked /> Kèm trang đáp
              án</label
            ><span id="cnt" style="color: var(--mu)"></span>
          </div>
          <div class="row">
            <button class="btn big" onclick="gen()">✨ Tạo đề</button>
          </div>
        </div>
      </section>
      <section class="card">
        <div class="row" style="margin: 0 0 10px">
          <button class="btn" onclick="docxSave()">⬇ Tải DOCX</button
          ><button class="btn" onclick="pdfSave()">⬇ Tải PDF</button
          ><button class="btn g" onclick="gen()">🔄 Đề mới</button>
        </div>
        <div class="pv">
          <div id="paper">
            <div class="empty">
              Chưa có đề. Hãy tích chọn module ở bên trái rồi bấm “Tạo đề”.
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="toast"></div>
    <script>
      const $ = (i) => document.getElementById(i),
        r = (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
        p = (a) => a[r(0, a.length - 1)],
        gc = (a, b) => (b ? gc(b, a % b) : a),
        F = (n, d) => {
          const k = gc(n, d);
          n /= k;
          d /= k;
          return d == 1 ? "" + n : "⟦" + n + "|" + d + "⟧";
        },
        D = (x) => String(+(+x).toFixed(4)).replace(".", ","),
        N = (n) =>
          n < 1e4 ? "" + n : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."),
        _ = "……",
        L = "abcdefghij",
        col = ["", "#ff7a59", "#e6a100", "#21b573", "#2f8cff", "#a259ff"];
      /* ---------- Phân số, trắc nghiệm, bẫy đáp án ---------- */
      const FR = (n, d) => `⟦${n}|${d}⟧`,
        FRD = /⟦([^|⟧]*)\|([^⟧]*)⟧/g,
        eh = (s) =>
          s.replace(
            /[&<>]/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
          ),
        H = (s) =>
          eh(String(s)).replace(
            FRD,
            (m, a, b) => `<span class="fr"><i>${a}</i><i>${b}</i></span>`,
          ),
        shuf = (a) => {
          a = a.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = r(0, i);
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        },
        RXN = /⟦(\d+)\|(\d+)⟧|\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:,\d+)?/g,
        toks = (s) => {
          const a = [];
          let m;
          RXN.lastIndex = 0;
          while ((m = RXN.exec(s)))
            a.push(
              m[1]
                ? { f: 1, n: +m[1], d: +m[2], v: +m[1] / +m[2], i: m.index, l: m[0].length }
                : {
                    v: +m[0].replace(/\./g, "").replace(",", "."),
                    dec: (m[0].split(",")[1] || "").length,
                    i: m.index,
                    l: m[0].length,
                  },
            );
          return a;
        },
        fmtV = (v) => {
          if (!isFinite(v) || v < 0) return null;
          v = Math.round(v * 1e4) / 1e4;
          return Number.isInteger(v) ? (v >= 1e4 ? N(v) : "" + v) : D(v);
        },
        like = (s, vals) => {
          const t = toks(s);
          let o = "",
            q = 0;
          t.forEach((k, i) => {
            o += s.slice(q, k.i);
            q = k.i + k.l;
            const v = vals[i];
            if (v == null) o += s.slice(k.i, k.i + k.l);
            else if (typeof v == "string") o += v;
            else {
              const f = fmtV(v);
              if (f == null) throw 0;
              o += f;
            }
          });
          return o + s.slice(q);
        },
        ckey = (s) =>
          String(s).replace(RXN, "#") +
          "|" +
          toks(String(s))
            .map((k) => Math.round(k.v * 1e6))
            .join(","),
        gmut = (ans, g, sc) => {
          const t = toks(ans),
            c = [];
          t.forEach((k, i) => {
            const put = (v, w) => {
              try {
                if (!k.f && !k.dec && !Number.isInteger(v)) return;
                const z = [];
                z[i] = v;
                c.push([like(ans, z), w + Math.random() * 0.9]);
              } catch (e) {}
            };
            if (k.f) {
              const rd = (n, d) => {
                const q = gc(n, d);
                return F(n / q, d / q);
              };
              [
                [k.n + 1, k.d],
                [k.n, k.d + 1],
                [Math.max(1, k.n - 1), k.d],
                [k.n, Math.max(2, k.d - 1)],
                [k.d, k.n],
                [k.n + 1, k.d + 1],
              ].forEach((z, j) => put(rd(z[0], z[1]), 1 + j * 0.2));
            } else {
              const u = Math.pow(10, -k.dec),
                x = k.v,
                sd = String(Math.round(x / u));
              put(x + u, 1);
              put(x - u, 1);
              put(x + 2 * u, 2);
              put(x - 2 * u, 2);
              if (x >= 15 * u) {
                put(x + 10 * u, 1.5);
                put(x - 10 * u, 1.5);
              }
              if (x >= 200 * u) {
                put(x + 100 * u, 2.5);
                put(x - 100 * u, 2.5);
              }
              if (sd.length > 1) {
                const j = r(0, sd.length - 2),
                  a = sd.split("");
                [a[j], a[j + 1]] = [a[j + 1], a[j]];
                if (a[0] != "0") put(+a.join("") * u, 1.7);
              }
              if (g >= 3 || k.dec || sc) {
                put(x * 10, sc ? 1.2 : 2.2);
                if (x > 0) put(x / 10, sc ? 1.2 : 2.2);
                if (sc) put(x * 100, 1.6);
              }
              if (x >= 4) {
                put(x * 2, 3);
                put(x / 2, 3);
              }
              if (k.dec) {
                put(x + 1, 1.2);
                put(x - 1, 1.2);
              }
            }
          });
          return c;
        },
        SGN = [">", "<", "="];
      function mkOpts(x, g, sc) {
        const ans = String(x[1]);
        let o;
        if (SGN.includes(ans)) o = SGN;
        else {
          const seen = new Set([ckey(ans)]),
            out = [],
            hasF = toks(ans).some((k) => k.f),
            add1 = (s) => {
              if (s == null || out.length >= 3) return;
              s = String(s);
              if (!hasF && !ans.includes(",") && s.includes(",")) return;
              const k = ckey(s);
              if (seen.has(k)) return;
              seen.add(k);
              out.push(s);
            };
          shuf(x[3] || []).forEach((t) => {
            try {
              add1(
                typeof t == "number"
                  ? like(ans, [t])
                  : Array.isArray(t)
                    ? like(ans, t)
                    : t,
              );
            } catch (e) {}
          });
          if (out.length < 3)
            gmut(ans, g, sc)
              .sort((a, b) => a[1] - b[1])
              .forEach((z) => add1(z[0]));
          if (out.length < 3 && toks(ans).length)
            [3, -3, 4, -4, 5, 6, 7].forEach((d) => {
              try {
                add1(like(ans, [toks(ans)[0].v + d]));
              } catch (e) {}
            });
          o = shuf([ans, ...out]);
        }
        x.o = o;
        x.c = o.indexOf(ans);
        return x;
      }

      const M = [],
        add = (g, id, name, t, gen, w) => M.push({ g, id, name, t, gen, w });
      add(1, "c1", "Phép cộng (phạm vi 10, 20, 100)", "Tính:", (l) => {
        const m = [10, 20, 100][l - 1],
          a = r(1, m - 1),
          b = r(0, m - a); return [`${a} + ${b} = ${_}`, a + b, null, [Math.abs(a - b), a + b + 1, a + b - 1]];
      });
      add(1, "t1", "Phép trừ (phạm vi 10, 20, 100)", "Tính:", (l) => {
        const m = [10, 20, 100][l - 1],
          a = r(2, m),
          b = r(0, a); return [`${a} − ${b} = ${_}`, a - b, null, [a + b, a - b + 1, a - b - 1]];
      });
      add(1, "s1", "So sánh số", "Điền dấu >, <, = vào chỗ chấm:", (l) => {
        let x, y, q;
        if (l < 3) {
          const m = l == 1 ? 10 : 99;
          x = r(0, m);
          y = r(0, m);
          q = `${x} ${_} ${y}`;
        } else {
          const a = r(1, 9),
            b = r(1, 9);
          x = a + b;
          y = r(5, 20);
          q = `${a} + ${b} ${_} ${y}`;
        }

      brain(4,"geom4","Cùng diện tích, khác hình", "So sánh hình:",(l)=>{
        const a=r(3,10),b=r(2,8),area=a*b;
        return choice(`Hình chữ nhật dài ${a} cm, rộng ${b} cm. Hình khác có cùng diện tích ${area} cm². Diện tích của hình chữ nhật ban đầu là?`,area,[area,area+a,area-b,a+b]);
      });

      // LỚP 5 — thập phân, phần trăm, chuyển động, thể tích, dữ liệu và tối ưu đơn giản.
      brain(5,"err5","Bắt lỗi số thập phân", "Chọn bạn tính đúng:",(l)=>{
        const a=p([1.2,2.5,3.4,4.6]),b=p([0.3,0.4,0.5]),good=Math.round((a+b)*10)/10,bad=Math.round((a+b+0.1)*10)/10;
        return choice(`${a} + ${b}: An được ${D(good)}, Bình được ${D(bad)}. Ai đúng?`,"An",["An","Bình","Cả hai","Không ai"]);
      });
      brain(5,"rev5","Đảo ngược phần trăm", "Tìm số ban đầu:",(l)=>{
        const base=p([100,200,300,400,500]),pct=p([10,20,25,50]),part=base*pct/100;
        return choice(`${pct}% của một số là ${part}. Số đó là?`,base,[base,part,base+part,base-part]);
      });
      brain(5,"opt5","Chọn phương án tiết kiệm", "Tư duy tối ưu:",(l)=>{
        const a=r(2,5),b=r(2,5),single=10,pack=single*2-5,need=a*2+b*2;
        return choice(`Mua ${a} cặp bút. Có thể mua từng chiếc giá ${single} nghìn hoặc hộp 2 chiếc giá ${pack} nghìn. Cách mua rẻ hơn là?`,"Mua hộp 2 chiếc",["Mua hộp 2 chiếc","Mua từng chiếc","Hai cách luôn bằng nhau","Không đủ dữ kiện"]);
      });
      brain(5,"data5","Đọc dữ liệu rồi tính ngược", "Suy luận từ bảng:",(l)=>{
        const total=r(40,90),pct=p([20,25,50]),part=total*pct/100;
        return choice(`Một lớp có ${total} bạn, ${pct}% tham gia câu lạc bộ. Có bao nhiêu bạn tham gia?`,part,[part,part+1,part-1,total-pct]);
      });
      brain(5,"motion5b","Đổi cách hỏi chuyển động", "Tìm thời gian:",(l)=>{
        const v=p([30,40,50,60]),t=p([2,3,4]),s=v*t;
        return choice(`Một xe đi ${s} km với vận tốc ${v} km/giờ. Xe đi trong bao lâu?`,t,[t,t+1,v,s]);
      });

      // Các module "HSG/Violympic" vẫn bị khóa trong phạm vi kiến thức của chính lớp đó.
      M.filter(m => /^(hsg|olym)/.test(m.id)).forEach(m => m.h = 1);
      M.forEach(m => { if (m.h) m.w = 2; });

      const sel = {};
      M.forEach((m) => (sel[m.id] = { on: false, l: 1, n: 5, mc: 0 }));
      let G = 1,
        P = null;
      const LB = ["Dễ", "Vừa", "Khó"],
        LH = ["Nâng cao", "HSG Tỉnh", "HSG Quốc gia"],
        LT = "ABCD";
      function modHtml(m) {
        const s = sel[m.id],
          lb = m.h ? LH : LB;
        return `<div class="mod ${s.on ? "on" : ""}" style="--c:${col[G]}"><label><input type=checkbox ${s.on ? "checked" : ""} onchange="sel['${m.id}'].on=this.checked;render()"><b>${m.name}</b></label><div class=ctl><span class=seg>${[1, 2, 3].map((i) => `<button class="${s.l == i ? "a" : ""}" onclick="sel['${m.id}'].l=${i};render()">${lb[i - 1]}</button>`).join("")}</span><span class=seg>${["Tự luận", "Trắc nghiệm"].map((t, i) => `<button class="${!!s.mc == !!i ? "a" : ""}" onclick="sel['${m.id}'].mc=${i};render()">${t}</button>`).join("")}</span><label>Số câu <input type=number min=1 max=10 value=${s.n} onchange="sel['${m.id}'].n=Math.min(10,Math.max(1,+this.value||1))"></label></div></div>`;
      }
      function render() {
        $("tabs").innerHTML = [1, 2, 3, 4, 5]
          .map(
            (g) =>
              `<button class="tab ${g == G ? "on" : ""}" style="--c:${col[g]}" onclick="G=${g};render()">Lớp ${g}</button>`,
          )
          .join("");
        $("mods").innerHTML =
          `<div class="curriculum-note"><b>Khung lớp ${G}:</b> chỉ sinh câu hỏi trong phạm vi kiến thức của lớp ${G}; các dạng chưa thuộc lớp này sẽ không xuất hiện.</div>` +
          M.filter((m) => m.g == G && !m.h)
            .map(modHtml)
            .join("") +
          `<div class="hh">🏆 Học sinh giỏi: Nâng cao → HSG Tỉnh → HSG Quốc gia</div>` +
          M.filter((m) => m.g == G && m.h)
            .map(modHtml)
            .join("");
        const k = M.filter((m) => sel[m.id].on);
        const sp=structurePlan(G);
        $("cnt").textContent = sp
          ? `Cấu trúc riêng: ${sp.reduce((a,z)=>a+z.n,0)} câu · ${sp.length} phần`
          : `Đã chọn ${k.length} module · ${k.reduce((a, m) => a + sel[m.id].n, 0)} câu`;
      }
      function all(v) {
        M.filter((m) => m.g == G).forEach((m) => (sel[m.id].on = !!v));
        render();
      }
      function setMode(v) {
        M.filter((m) => m.g == G).forEach((m) => (sel[m.id].mc = v));
        render();
      }
      function toast(s) {
        const t = $("toast");
        t.textContent = s;
        t.classList.add("s");
        setTimeout(() => t.classList.remove("s"), 2200);
      }
      const dts = ".".repeat(400),
        dl = (t) => `<div class=ln><span>${t}</span><span class=dt>${dts}</span></div>`,
        vis = (s) => String(s).replace(FRD, "xxx").length,
        oc = (x) => {
          const mx = Math.max(...x.o.map(vis));
          return mx <= 12 ? "c4" : mx <= 30 ? "c2" : "c1";
        },
        NL = { 1: 3, 3: 6 };
      function gen() {
        const plan = structurePlan(G);
        const A = plan ? plan.map(z=>z.m) : M.filter((m) => sel[m.id].on);
        if (!A.length) return toast(plan ? "Không nhận diện được cấu trúc. Hãy dùng tên dạng bài gợi ý." : "Hãy tích chọn ít nhất một module");
        const nmc = A.filter((m) => plan ? false : sel[m.id].mc).length,
          B = plan ? plan.map(z=>z.m) : [...A.filter((m) => sel[m.id].mc), ...A.filter((m) => !sel[m.id].mc)],
          n = B.length,
          bs = Math.floor(40 / n) / 4,
          gs = [...new Set(A.map((m) => m.g))];
        P = {
          title: $("ti").value || "ĐỀ KIỂM TRA MÔN TOÁN",
          school: $("sc").value,
          time: $("tm").value,
          lop: gs.length == 1 ? gs[0] : "……",
          sp: $("sp").checked,
          key: $("key").checked,
          both: nmc > 0 && nmc < n,
          secs: B.map((m, i) => {
            const planItem = plan ? plan.find(z=>z.m.id===m.id) : null;
            const s = sel[m.id] || {l:1,n:1,mc:0},
              mc = plan ? false : !!s.mc,
              seen = new Set(),
              it = [];
            const wanted = planItem ? planItem.n : s.n;
            for (let k = 0; k < wanted * 40 && it.length < wanted; k++) {
              let x;
              try {
                x = m.gen(s.l);
                if (mc) mkOpts(x, m.g, m.sc);
              } catch (e) {
                continue;
              }
              const h = x[0] + x[1] + (x[2] || "");
              if (!seen.has(h)) {
                seen.add(h);
                it.push(x);
              }
            }
            return { m, l: s.l, mc, it, pt: i < n - 1 ? bs : 10 - bs * (n - 1) };
          }),
        };
        const fg = (x) => (x[2] ? `<span class=fg>${x[2]}</span>` : ""),
          item = (s, x, j) =>
            s.mc
              ? `<div class=mc><div class=qi><span><b>Câu ${j + 1}.</b> ${H(x[0])}</span>${fg(x)}</div><div class="op ${oc(x)}">${x.o.map((v, i) => `<span><b>${LT[i]}.</b> ${H(v)}</span>`).join("")}</div></div>`
              : `<div><div class=qi><span>${L[j]}) ${H(x[0])}</span>${fg(x)}</div>${P.sp && NL[s.m.w] ? dl("").repeat(NL[s.m.w]) + dl("Đáp số: ") : ""}${P.sp && s.m.w == 2 ? dl("Trả lời: ") : ""}</div>`;
        $("paper").innerHTML =
          `<table class=hd><tr><td><b>${eh(P.school)}</b></td><td><b>${eh(P.title)}</b><br>Môn: Toán – Lớp ${P.lop}<br><i>Thời gian làm bài: ${eh(P.time)}</i></td></tr></table>\n<table class=bx><tr><td style="width:46%">Họ và tên: ......................<br><br>Lớp: ........ Số báo danh: ........</td><td style="width:14%;text-align:center"><b>Điểm</b></td><td><b>Nhận xét của giáo viên</b></td></tr></table>` +
          P.secs
            .map(
              (s, i) =>
                (P.both && (i == 0 || (!s.mc && P.secs[i - 1].mc))
                  ? `<h3 class=pt>${s.mc ? "Phần I. Trắc nghiệm" : "Phần II. Tự luận"}</h3>`
                  : "") +
                `<h3>Bài ${i + 1} <em>(${D(s.pt)} điểm)</em>. ${H(s.m.t)}${s.mc ? ' <span class=hn>(Khoanh vào chữ cái đặt trước đáp án đúng)</span>' : ""}</h3><div class="qs ${s.mc ? "mq" : s.m.w ? "w" : P.sp ? (s.m.g >= 3 ? "sp2" : "sp1") : ""}">${s.it.map((x, j) => item(s, x, j)).join("")}</div>`,
            )
            .join("") +
          `<div class=end>— Hết —</div>` +
          (P.key
            ? `<div class=ans><h2>ĐÁP ÁN VÀ BIỂU ĐIỂM</h2>${P.secs.map((s, i) => `<p><b>Bài ${i + 1} (${D(s.pt)} điểm):</b> ${s.it.map((x, j) => (s.mc ? `Câu ${j + 1}: ${LT[x.c]} (${H(x[1])})` : `${L[j]}) ${H(x[1])}`)).join(" &nbsp; ; &nbsp; ")}</p>`).join("")}</div>`
            : "");
      }
      async function save(b, n) {
        try {
          const d = window.claude && (await claude.use("downloads"));
          if (d) {
            await d.save({ filename: n, data: b });
            return;
          }
        } catch (e) {
          if (e && e.code == "declined") return;
        }
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = n;
        a.click();
      }
      const png = (s) =>
        new Promise((ok) => {
          const [, w, h] = s.match(/width="(\d+)" height="(\d+)"/),
            i = new Image();
          i.onload = () => {
            const c = document.createElement("canvas");
            c.width = w * 2;
            c.height = h * 2;
            const x = c.getContext("2d");
            x.fillStyle = "#fff";
            x.fillRect(0, 0, c.width, c.height);
            x.drawImage(i, 0, 0, c.width, c.height);
            c.toBlob(async (b) => ok(new Uint8Array(await b.arrayBuffer())));
          };
          i.onerror = () => ok(null);
          i.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
        });
      async function docxSave() {
        if (!P) return toast("Hãy tạo đề trước");
        if (!window.docx) return toast("Chưa tải được thư viện DOCX");
        const {
            Document,
            Packer,
            Paragraph,
            TextRun,
            AlignmentType,
            Table,
            TableRow,
            TableCell,
            WidthType,
            BorderStyle,
            ImageRun,
            HeightRule,
            TabStopType,
            LeaderType,
            Tab,
            Math: DM,
            MathRun,
            MathFraction,
          } = docx,
          C = AlignmentType.CENTER,
          TW = 9638,
          FN = "Times New Roman",
          run = (s, o = {}) => new TextRun({ text: s, font: FN, size: 26, ...o }),
          tab = () => new TextRun({ children: [new Tab()], font: FN, size: 26 }),
          rr = (s, o = {}) => {
            s = String(s);
            const out = [];
            let last = 0;
            for (const m of s.matchAll(FRD)) {
              if (m.index > last) out.push(run(s.slice(last, m.index), o));
              out.push(
                new DM({
                  children: [
                    new MathFraction({
                      numerator: [new MathRun(m[1])],
                      denominator: [new MathRun(m[2])],
                    }),
                  ],
                }),
              );
              last = m.index + m[0].length;
            }
            if (last < s.length) out.push(run(s.slice(last), o));
            return out;
          },
          t = (s, o = {}) => new Paragraph({ ...o.p, children: rr(s, o.r) }),
          ln = (s) =>
            new Paragraph({
              spacing: { before: 200 },
              tabStops: [{ type: TabStopType.RIGHT, position: TW, leader: LeaderType.DOT }],
              children: [...(s ? [run(s + " ")] : []), tab()],
            }),
          opRow = (vals, from, cols) =>
            new Paragraph({
              spacing: { after: 60 },
              tabStops: Array.from({ length: cols - 1 }, (q, i) => ({
                type: TabStopType.LEFT,
                position: Math.round((TW * (i + 1)) / cols),
              })),
              children: vals.flatMap((v, i) => [
                ...(i ? [tab()] : []),
                run(LT[from + i] + ". ", { bold: true }),
                ...rr(v),
              ]),
            }),
          nb = { style: BorderStyle.NONE, size: 0, color: "FFFFFF" },
          nob = { top: nb, bottom: nb, left: nb, right: nb },
          cell = (ps, w, b) =>
            new TableCell({
              width: { size: w, type: WidthType.PERCENTAGE },
              borders: b,
              children: ps,
            }),
          hd = new Table({
            width: { size: 100, type: WidthType.PERCENTAGE },
            rows: [
              new TableRow({
                children: [
                  cell([t(P.school, { r: { bold: true } })], 50, nob),
                  cell(
                    [
                      t(P.title, { p: { alignment: C }, r: { bold: true } }),
                      t(`Môn: Toán – Lớp ${P.lop}`, { p: { alignment: C } }),
                      t(`Thời gian làm bài: ${P.time}`, {
                        p: { alignment: C },
                        r: { italics: true },
                      }),
                    ],
                    50,
                    nob,
                  ),
                ],
              }),
            ],
          }),
          bx = new Table({
            width: { size: 100, type: WidthType.PERCENTAGE },
            rows: [
              new TableRow({
                height: { value: 1300, rule: HeightRule.ATLEAST },
                children: [
                  cell(
                    [
                      t("Họ và tên: ......................"),
                      t("Lớp: ........ SBD: ........"),
                    ],
                    46,
                  ),
                  cell([t("Điểm", { p: { alignment: C }, r: { bold: true } })], 14),
                  cell([t("Nhận xét của giáo viên", { r: { bold: true } })], 40),
                ],
              }),
            ],
          }),
          c = [hd, t(""), bx];
        for (const [i, s] of P.secs.entries()) {
          if (P.both && (i == 0 || (!s.mc && P.secs[i - 1].mc)))
            c.push(
              t(s.mc ? "PHẦN I. TRẮC NGHIỆM" : "PHẦN II. TỰ LUẬN", {
                p: { alignment: C, spacing: { before: 280, after: 60 }, keepNext: true },
                r: { bold: true },
              }),
            );
          c.push(
            t(
              `Bài ${i + 1} (${D(s.pt)} điểm). ${s.m.t}${s.mc ? " (Khoanh vào chữ cái đặt trước đáp án đúng)" : ""}`,
              {
                r: { bold: true },
                p: { spacing: { before: 240, after: 100 }, keepNext: true },
              },
            ),
          );
          for (const [j, x] of s.it.entries()) {
            const q = s.mc
              ? new Paragraph({
                  keepNext: true,
                  spacing: { after: 60 },
                  children: [run(`Câu ${j + 1}. `, { bold: true }), ...rr(x[0])],
                })
              : t(`${L[j]}) ${x[0]}`, {
                  p: {
                    spacing: {
                      before: s.m.w ? 140 : 0,
                      after: s.m.w ? 80 : P.sp ? (s.m.g >= 3 ? 900 : 300) : 180,
                    },
                  },
                });
            c.push(q);
            if (x[2]) {
              const [, w, h] = x[2].match(/width="(\d+)" height="(\d+)"/),
                d = await png(x[2]);
              if (d)
                c.push(
                  new Paragraph({
                    alignment: C,
                    keepNext: !!s.mc,
                    children: [
                      new ImageRun({
                        data: d,
                        transformation: { width: +w, height: +h },
                      }),
                    ],
                  }),
                );
            }
            if (s.mc) {
              const cl = oc(x),
                cols = cl == "c4" ? 4 : cl == "c2" ? 2 : 1;
              for (let k = 0; k < x.o.length; k += cols)
                c.push(opRow(x.o.slice(k, k + cols), k, cols));
              c.push(t("", { p: { spacing: { after: 60 } } }));
            } else if (P.sp) {
              if (NL[s.m.w]) {
                for (let k = 0; k < NL[s.m.w]; k++) c.push(ln());
                c.push(ln("Đáp số:"));
              } else if (s.m.w == 2) c.push(ln("Trả lời:"));
            }
          }
        }
        c.push(
          t("— Hết —", {
            p: { alignment: C, spacing: { before: 300 } },
            r: { italics: true },
          }),
        );
        if (P.key) {
          c.push(
            t("ĐÁP ÁN VÀ BIỂU ĐIỂM", {
              p: {
                pageBreakBefore: true,
                alignment: C,
                spacing: { after: 200 },
              },
              r: { bold: true, size: 32 },
            }),
          );
          P.secs.forEach((s, i) =>
            c.push(
              t(
                `Bài ${i + 1} (${D(s.pt)} điểm): ` +
                  s.it
                    .map((x, j) =>
                      s.mc ? `Câu ${j + 1}: ${LT[x.c]} (${x[1]})` : `${L[j]}) ${x[1]}`,
                    )
                    .join(";   "),
                { p: { spacing: { after: 120 } } },
              ),
            ),
          );
        }
        save(
          await Packer.toBlob(
            new Document({
              sections: [
                {
                  properties: {
                    page: { margin: { top: 1134, bottom: 1134, left: 1134, right: 1134 } },
                  },
                  children: c,
                },
              ],
            }),
          ),
          "de-toan.docx",
        );
      }
      async function pdfSave() {
        if (!P) return toast("Hãy tạo đề trước");
        toast("Đang tạo PDF…");
        if (!window.html2pdf)
          await new Promise((ok, no) => {
            const s = document.createElement("script");
            s.src =
              "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
            s.onload = ok;
            s.onerror = no;
            document.head.appendChild(s);
          }).catch(() => 0);
        if (!window.html2pdf) return toast("Chưa tải được thư viện PDF");
        save(
          await html2pdf()
            .set({
              margin: 10,
              image: { type: "jpeg", quality: 0.95 },
              html2canvas: { scale: 2 },
              jsPDF: { unit: "mm", format: "a4" },
              pagebreak: { mode: ["css", "legacy"], avoid: ["h3", ".qs>div", ".mc"] },
            })
            .from($("paper"))
            .outputPdf("blob"),
          "de-toan.pdf",
        );
      }
      render();
    </script>
  </body>
</html>
