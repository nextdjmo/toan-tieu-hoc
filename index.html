<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tạo đề Toán Tiểu học</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f3f6ff;
        --cd: #fff;
        --tx: #1f2a44;
        --mu: #6b7794;
        --bd: #e0e6f6;
        --pr: #4f6bff;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #12162a;
          --cd: #1b2140;
          --tx: #e8ecff;
          --mu: #9aa5cc;
          --bd: #2c3560;
        }
      }
      :root[data-theme="dark"] {
        --bg: #12162a;
        --cd: #1b2140;
        --tx: #e8ecff;
        --mu: #9aa5cc;
        --bd: #2c3560;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family: Nunito, system-ui, sans-serif;
      }
      header {
        background: linear-gradient(120deg, #4f6bff, #8b5cf6 60%, #ec4899);
        color: #fff;
        padding: 26px 20px;
        text-align: center;
      }
      header h1 {
        margin: 0;
        font-size: clamp(22px, 4vw, 32px);
        font-weight: 800;
      }
      header p {
        margin: 6px 0 0;
        opacity: 0.9;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 16px;
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
        gap: 16px;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--cd);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 4px 14px rgba(60, 80, 160, 0.07);
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .tab {
        flex: 1;
        min-width: 64px;
        border: 2px solid var(--bd);
        background: var(--cd);
        color: var(--tx);
        border-radius: 12px;
        padding: 9px 6px;
        font:
          800 15px Nunito,
          sans-serif;
        cursor: pointer;
      }
      .tab.on {
        background: var(--c);
        border-color: var(--c);
        color: #fff;
      }
      .mod {
        border: 2px solid var(--bd);
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 8px;
        transition: 0.15s;
      }
      .mod.on {
        border-color: var(--c);
        background: color-mix(in srgb, var(--c) 9%, transparent);
      }
      .mod label b {
        margin-left: 6px;
        font-weight: 800;
      }
      .mod small {
        color: var(--mu);
        display: block;
        margin-top: 4px;
      }
      .ctl {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 8px;
        font-size: 13px;
        color: var(--mu);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--bd);
        border-radius: 9px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--tx);
        padding: 5px 12px;
        font:
          700 13px Nunito,
          sans-serif;
        cursor: pointer;
      }
      .seg button.a {
        background: var(--c);
        color: #fff;
      }
      input[type="number"],
      input[type="text"] {
        border: 1px solid var(--bd);
        background: var(--bg);
        color: var(--tx);
        border-radius: 8px;
        padding: 6px 8px;
        font: inherit;
      }
      input[type="number"] {
        width: 56px;
      }
      input[type="text"] {
        width: 100%;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--c, var(--pr));
        vertical-align: middle;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .btn {
        border: 0;
        border-radius: 12px;
        padding: 11px 16px;
        font:
          800 15px Nunito,
          sans-serif;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(120deg, #4f6bff, #8b5cf6);
      }
      .btn.g {
        background: var(--cd);
        color: var(--tx);
        border: 2px solid var(--bd);
      }
      .btn.big {
        width: 100%;
        font-size: 17px;
        padding: 14px;
      }
      .pv {
        overflow-x: auto;
        background: #dfe5f5;
        border-radius: 12px;
        padding: 12px;
      }
      .empty {
        color: var(--mu);
        text-align: center;
        padding: 40px 10px;
      }
      #paper {
        width: 190mm;
        min-height: 200mm;
        margin: 0 auto;
        background: #fff;
        color: #111;
        padding: 6mm 4mm;
        font:
          16px/1.5 "Times New Roman",
          serif;
      }
      #paper h1 {
        text-align: center;
        font-size: 22px;
        margin: 0 0 6px;
      }
      #paper h2 {
        text-align: center;
        margin: 0 0 10px;
      }
      #paper .nm {
        margin: 0 0 12px;
      }
      #paper h3 {
        font-size: 16px;
        margin: 14px 0 6px;
      }
      #paper h3 em {
        font-weight: 400;
        color: #666;
        font-size: 13px;
      }
      .qs {
        columns: 2;
        column-gap: 24px;
      }
      .qs > div {
        break-inside: avoid;
        padding: 5px 0;
      }
      .qs.w {
        columns: 1;
      }
      .qs.w > div {
        padding: 5px 0 26px;
      }
      .ans {
        page-break-before: always;
        padding-top: 6px;
      }
      .ans p {
        margin: 6px 0;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: #1f2a44;
        color: #fff;
        padding: 10px 18px;
        border-radius: 99px;
        opacity: 0;
        transition: 0.2s;
        pointer-events: none;
        z-index: 9;
      }
      #toast.s {
        opacity: 1;
      }
      #paper table {
        width: 100%;
        border-collapse: collapse;
      }
      .hd td {
        vertical-align: top;
        text-align: center;
        font-size: 15px;
        width: 50%;
      }
      .bx {
        margin: 8px 0 10px;
      }
      .bx td {
        border: 1px solid #111;
        padding: 6px 8px;
        vertical-align: top;
        height: 24mm;
        font-size: 15px;
      }
      #paper h3 em {
        color: #111;
        font-weight: 700;
        font-size: 16px;
        font-style: normal;
      }
      .qs.w > div {
        padding: 6px 0 12px;
      }
      .sp1 > div {
        padding-bottom: 14px;
      }
      .sp2 > div {
        padding-bottom: 38px;
      }
      .qi {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .fg {
        flex: none;
      }
      .ln {
        display: flex;
        align-items: flex-end;
        height: 8mm;
        overflow: hidden;
        white-space: nowrap;
      }
      .ln .dt {
        flex: 1;
        overflow: hidden;
        letter-spacing: 3px;
        color: #333;
        margin-left: 4px;
        line-height: 1.1;
      }
      .fr {
        display: inline-flex;
        flex-direction: column;
        vertical-align: middle;
        text-align: center;
        margin: 0 3px;
        line-height: 1.2;
        font-size: 0.95em;
      }
      .fr > i {
        font-style: normal;
        padding: 0 3px;
      }
      .fr > i:first-child {
        border-bottom: 1.5px solid #111;
      }
      .qs.mq {
        columns: 1;
      }
      .qs.mq > div {
        padding: 4px 0 8px;
      }
      .op {
        display: grid;
        gap: 2px 10px;
        margin-top: 3px;
        padding-left: 6px;
      }
      .op.c4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .op.c2 {
        grid-template-columns: repeat(2, 1fr);
      }
      .op.c1 {
        grid-template-columns: 1fr;
      }
      #paper h3.pt {
        text-align: center;
        font-size: 17px;
        margin: 18px 0 4px;
      }
      #paper .hn {
        font-weight: 400;
        font-style: italic;
        color: #555;
        font-size: 14px;
      }
      .hh {
        margin: 14px 0 8px;
        padding: 8px 12px;
        border-radius: 10px;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(120deg, #f59e0b, #ec4899);
      }
      .end {
        text-align: center;
        margin-top: 14px;
        font-style: italic;
      }
      label.f {
        display: block;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🧮 Tạo đề Toán Tiểu học</h1>
      <p>Chọn lớp → tích module → chọn mức độ (đến HSG Quốc gia) và dạng tự luận / trắc nghiệm → tải Word / PDF</p>
    </header>
    <main>
      <section>
        <div class="card">
          <div class="tabs" id="tabs"></div>
          <div id="mods"></div>
          <div class="row">
            <button class="btn g" onclick="all(1)">Chọn tất cả lớp này</button
            ><button class="btn g" onclick="all(0)">Bỏ chọn</button
            >
          </div>
          <div class="row">
            <button class="btn g" onclick="setMode(0)">✍️ Cả lớp: tự luận</button
            ><button class="btn g" onclick="setMode(1)">🔘 Cả lớp: trắc nghiệm</button>
          </div>
        </div>
        <div class="card" style="margin-top: 12px">
          <label class="f"
            >Tên trường<input
              type="text"
              id="sc"
              value="TRƯỜNG TIỂU HỌC ....................."
          /></label>
          <label class="f"
            >Tiêu đề đề bài<input
              type="text"
              id="ti"
              value="ĐỀ KIỂM TRA MÔN TOÁN"
          /></label>
          <label class="f"
            >Thời gian làm bài<input type="text" id="tm" value="40 phút"
          /></label>
          <div class="row">
            <label
              ><input type="checkbox" id="sp" checked /> Chừa chỗ trình bày lời
              giải</label
            >
          </div>
          <div class="row" style="align-items: center">
            <label
              ><input type="checkbox" id="key" checked /> Kèm trang đáp
              án</label
            ><span id="cnt" style="color: var(--mu)"></span>
          </div>
          <div class="row">
            <button class="btn big" onclick="gen()">✨ Tạo đề</button>
          </div>
        </div>
      </section>
      <section class="card">
        <div class="row" style="margin: 0 0 10px">
          <button class="btn" onclick="docxSave()">⬇ Tải DOCX</button
          ><button class="btn" onclick="pdfSave()">⬇ Tải PDF</button
          ><button class="btn g" onclick="gen()">🔄 Đề mới</button>
        </div>
        <div class="pv">
          <div id="paper">
            <div class="empty">
              Chưa có đề. Hãy tích chọn module ở bên trái rồi bấm “Tạo đề”.
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="toast"></div>
    <script>
      const $ = (i) => document.getElementById(i),
        r = (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
        p = (a) => a[r(0, a.length - 1)],
        gc = (a, b) => (b ? gc(b, a % b) : a),
        F = (n, d) => {
          const k = gc(n, d);
          n /= k;
          d /= k;
          return d == 1 ? "" + n : "⟦" + n + "|" + d + "⟧";
        },
        D = (x) => String(+(+x).toFixed(4)).replace(".", ","),
        N = (n) =>
          n < 1e4 ? "" + n : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."),
        _ = "……",
        L = "abcdefghij",
        col = ["", "#ff7a59", "#e6a100", "#21b573", "#2f8cff", "#a259ff"];
      /* ---------- Phân số, trắc nghiệm, bẫy đáp án ---------- */
      const FR = (n, d) => `⟦${n}|${d}⟧`,
        FRD = /⟦([^|⟧]*)\|([^⟧]*)⟧/g,
        eh = (s) =>
          s.replace(
            /[&<>]/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
          ),
        H = (s) =>
          eh(String(s)).replace(
            FRD,
            (m, a, b) => `<span class="fr"><i>${a}</i><i>${b}</i></span>`,
          ),
        shuf = (a) => {
          a = a.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = r(0, i);
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        },
        RXN = /⟦(\d+)\|(\d+)⟧|\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:,\d+)?/g,
        toks = (s) => {
          const a = [];
          let m;
          RXN.lastIndex = 0;
          while ((m = RXN.exec(s)))
            a.push(
              m[1]
                ? { f: 1, n: +m[1], d: +m[2], v: +m[1] / +m[2], i: m.index, l: m[0].length }
                : {
                    v: +m[0].replace(/\./g, "").replace(",", "."),
                    dec: (m[0].split(",")[1] || "").length,
                    i: m.index,
                    l: m[0].length,
                  },
            );
          return a;
        },
        fmtV = (v) => {
          if (!isFinite(v) || v < 0) return null;
          v = Math.round(v * 1e4) / 1e4;
          return Number.isInteger(v) ? (v >= 1e4 ? N(v) : "" + v) : D(v);
        },
        like = (s, vals) => {
          const t = toks(s);
          let o = "",
            q = 0;
          t.forEach((k, i) => {
            o += s.slice(q, k.i);
            q = k.i + k.l;
            const v = vals[i];
            if (v == null) o += s.slice(k.i, k.i + k.l);
            else if (typeof v == "string") o += v;
            else {
              const f = fmtV(v);
              if (f == null) throw 0;
              o += f;
            }
          });
          return o + s.slice(q);
        },
        ckey = (s) =>
          String(s).replace(RXN, "#") +
          "|" +
          toks(String(s))
            .map((k) => Math.round(k.v * 1e6))
            .join(","),
        gmut = (ans, g, sc) => {
          const t = toks(ans),
            c = [];
          t.forEach((k, i) => {
            const put = (v, w) => {
              try {
                if (!k.f && !k.dec && !Number.isInteger(v)) return;
                const z = [];
                z[i] = v;
                c.push([like(ans, z), w + Math.random() * 0.9]);
              } catch (e) {}
            };
            if (k.f) {
              const rd = (n, d) => {
                const q = gc(n, d);
                return F(n / q, d / q);
              };
              [
                [k.n + 1, k.d],
                [k.n, k.d + 1],
                [Math.max(1, k.n - 1), k.d],
                [k.n, Math.max(2, k.d - 1)],
                [k.d, k.n],
                [k.n + 1, k.d + 1],
              ].forEach((z, j) => put(rd(z[0], z[1]), 1 + j * 0.2));
            } else {
              const u = Math.pow(10, -k.dec),
                x = k.v,
                sd = String(Math.round(x / u));
              put(x + u, 1);
              put(x - u, 1);
              put(x + 2 * u, 2);
              put(x - 2 * u, 2);
              if (x >= 15 * u) {
                put(x + 10 * u, 1.5);
                put(x - 10 * u, 1.5);
              }
              if (x >= 200 * u) {
                put(x + 100 * u, 2.5);
                put(x - 100 * u, 2.5);
              }
              if (sd.length > 1) {
                const j = r(0, sd.length - 2),
                  a = sd.split("");
                [a[j], a[j + 1]] = [a[j + 1], a[j]];
                if (a[0] != "0") put(+a.join("") * u, 1.7);
              }
              if (g >= 3 || k.dec || sc) {
                put(x * 10, sc ? 1.2 : 2.2);
                if (x > 0) put(x / 10, sc ? 1.2 : 2.2);
                if (sc) put(x * 100, 1.6);
              }
              if (x >= 4) {
                put(x * 2, 3);
                put(x / 2, 3);
              }
              if (k.dec) {
                put(x + 1, 1.2);
                put(x - 1, 1.2);
              }
            }
          });
          return c;
        },
        SGN = [">", "<", "="];
      function mkOpts(x, g, sc) {
        const ans = String(x[1]);
        let o;
        if (SGN.includes(ans)) o = SGN;
        else {
          const seen = new Set([ckey(ans)]),
            out = [],
            hasF = toks(ans).some((k) => k.f),
            add1 = (s) => {
              if (s == null || out.length >= 3) return;
              s = String(s);
              if (!hasF && !ans.includes(",") && s.includes(",")) return;
              const k = ckey(s);
              if (seen.has(k)) return;
              seen.add(k);
              out.push(s);
            };
          shuf(x[3] || []).forEach((t) => {
            try {
              add1(
                typeof t == "number"
                  ? like(ans, [t])
                  : Array.isArray(t)
                    ? like(ans, t)
                    : t,
              );
            } catch (e) {}
          });
          if (out.length < 3)
            gmut(ans, g, sc)
              .sort((a, b) => a[1] - b[1])
              .forEach((z) => add1(z[0]));
          if (out.length < 3 && toks(ans).length)
            [3, -3, 4, -4, 5, 6, 7].forEach((d) => {
              try {
                add1(like(ans, [toks(ans)[0].v + d]));
              } catch (e) {}
            });
          o = shuf([ans, ...out]);
        }
        x.o = o;
        x.c = o.indexOf(ans);
        return x;
      }

      const M = [],
        add = (g, id, name, t, gen, w) => M.push({ g, id, name, t, gen, w });
      add(1, "c1", "Phép cộng (phạm vi 10, 20, 100)", "Tính:", (l) => {
        const m = [10, 20, 100][l - 1],
          a = r(1, m - 1),
          b = r(0, m - a); return [`${a} + ${b} = ${_}`, a + b, null, [Math.abs(a - b), a + b + 1, a + b - 1]];
      });
      add(1, "t1", "Phép trừ (phạm vi 10, 20, 100)", "Tính:", (l) => {
        const m = [10, 20, 100][l - 1],
          a = r(2, m),
          b = r(0, a); return [`${a} − ${b} = ${_}`, a - b, null, [a + b, a - b + 1, a - b - 1]];
      });
      add(1, "s1", "So sánh số", "Điền dấu >, <, = vào chỗ chấm:", (l) => {
        let x, y, q;
        if (l < 3) {
          const m = l == 1 ? 10 : 99;
          x = r(0, m);
          y = r(0, m);
          q = `${x} ${_} ${y}`;
        } else {
          const a = r(1, 9),
            b = r(1, 9);
          x = a + b;
          y = r(5, 20);
          q = `${a} + ${b} ${_} ${y}`;
        }
        return [q, x > y ? ">" : x < y ? "<" : "="];
      });
      add(
        1,
        "d1",
        "Dãy số, số còn thiếu",
        "Điền số thích hợp vào chỗ chấm:",
        (l) => {
          const s = l == 1 ? 1 : l == 2 ? p([1, 2]) : p([5, 10]),
            a = l == 1 ? r(0, 5) : l == 2 ? r(0, 10) : s * r(0, 6),
            h = r(1, 3),
            v = [0, 1, 2, 3, 4].map((i) => a + i * s),
            x = v[h];
          v[h] = _;
          return [v.join(", "), x];
        },
      );
      add(
        2,
        "c2",
        "Cộng, trừ trong phạm vi 100 (không nhớ / có nhớ)",
        "Tính:",
        (l) => {
          for (;;) {
            const a = r(10, 99),
              b = r(10, 99),
              c = r(5, 60),
              o = r(0, 1);
            if (l == 3) {
              if (a + b <= 100 && c < a + b)
                return [`${a} + ${b} − ${c} = ${_}`, a + b - c];
              continue;
            }
            const k = o ? a % 10 < b % 10 : (a % 10) + (b % 10) > 9;
            if (k != (l == 2)) continue;
            if (o) {
              if (a > b) return [`${a} − ${b} = ${_}`, a - b];
            } else if (a + b <= 100) return [`${a} + ${b} = ${_}`, a + b];
          }
        },
      );
      add(2, "n2", "Bảng nhân 2–5, 6–9", "Tính:", (l) => {
        const t = l == 1 ? r(2, 5) : r(6, 9),
          b = r(1, 10);
        return l == 3
          ? p([

          c = [hd, t(""), bx];
        for (const [i, s] of P.secs.entries()) {
          if (P.both && (i == 0 || (!s.mc && P.secs[i - 1].mc)))
            c.push(
              t(s.mc ? "PHẦN I. TRẮC NGHIỆM" : "PHẦN II. TỰ LUẬN", {
                p: { alignment: C, spacing: { before: 280, after: 60 }, keepNext: true },
                r: { bold: true },
              }),
            );
          c.push(
            t(
              `Bài ${i + 1} (${D(s.pt)} điểm). ${s.m.t}${s.mc ? " (Khoanh vào chữ cái đặt trước đáp án đúng)" : ""}`,
              {
                r: { bold: true },
                p: { spacing: { before: 240, after: 100 }, keepNext: true },
              },
            ),
          );
          for (const [j, x] of s.it.entries()) {
            const q = s.mc
              ? new Paragraph({
                  keepNext: true,
                  spacing: { after: 60 },
                  children: [run(`Câu ${j + 1}. `, { bold: true }), ...rr(x[0])],
                })
              : t(`${L[j]}) ${x[0]}`, {
                  p: {
                    spacing: {
                      before: s.m.w ? 140 : 0,
                      after: s.m.w ? 80 : P.sp ? (s.m.g >= 3 ? 900 : 300) : 180,
                    },
                  },
                });
            c.push(q);
            if (x[2]) {
              const [, w, h] = x[2].match(/width="(\d+)" height="(\d+)"/),
                d = await png(x[2]);
              if (d)
                c.push(
                  new Paragraph({
                    alignment: C,
                    keepNext: !!s.mc,
                    children: [
                      new ImageRun({
                        data: d,
                        transformation: { width: +w, height: +h },
                      }),
                    ],
                  }),
                );
            }
            if (s.mc) {
              const cl = oc(x),
                cols = cl == "c4" ? 4 : cl == "c2" ? 2 : 1;
              for (let k = 0; k < x.o.length; k += cols)
                c.push(opRow(x.o.slice(k, k + cols), k, cols));
              c.push(t("", { p: { spacing: { after: 60 } } }));
            } else if (P.sp) {
              if (NL[s.m.w]) {
                for (let k = 0; k < NL[s.m.w]; k++) c.push(ln());
                c.push(ln("Đáp số:"));
              } else if (s.m.w == 2) c.push(ln("Trả lời:"));
            }
          }
        }
        c.push(
          t("— Hết —", {
            p: { alignment: C, spacing: { before: 300 } },
            r: { italics: true },
          }),
        );
        if (P.key) {
          c.push(
            t("ĐÁP ÁN VÀ BIỂU ĐIỂM", {
              p: {
                pageBreakBefore: true,
                alignment: C,
                spacing: { after: 200 },
              },
              r: { bold: true, size: 32 },
            }),
          );
          P.secs.forEach((s, i) =>
            c.push(
              t(
                `Bài ${i + 1} (${D(s.pt)} điểm): ` +
                  s.it
                    .map((x, j) =>
                      s.mc ? `Câu ${j + 1}: ${LT[x.c]} (${x[1]})` : `${L[j]}) ${x[1]}`,
                    )
                    .join(";   "),
                { p: { spacing: { after: 120 } } },
              ),
            ),
          );
        }
        save(
          await Packer.toBlob(
            new Document({
              sections: [
                {
                  properties: {
                    page: { margin: { top: 1134, bottom: 1134, left: 1134, right: 1134 } },
                  },
                  children: c,
                },
              ],
            }),
          ),
          "de-toan.docx",
        );
      }
      async function pdfSave() {
        if (!P) return toast("Hãy tạo đề trước");
        toast("Đang tạo PDF…");
        if (!window.html2pdf)
          await new Promise((ok, no) => {
            const s = document.createElement("script");
            s.src =
              "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
            s.onload = ok;
            s.onerror = no;
            document.head.appendChild(s);
          }).catch(() => 0);
        if (!window.html2pdf) return toast("Chưa tải được thư viện PDF");
        save(
          await html2pdf()
            .set({
              margin: 10,
              image: { type: "jpeg", quality: 0.95 },
              html2canvas: { scale: 2 },
              jsPDF: { unit: "mm", format: "a4" },
              pagebreak: { mode: ["css", "legacy"], avoid: ["h3", ".qs>div", ".mc"] },
            })
            .from($("paper"))
            .outputPdf("blob"),
          "de-toan.pdf",
        );
      }
      render();
    </script>
  </body>
</html>
